<!DOCTYPE html>
<html lang="pt-br">
    <head>

        <meta charset="UTF-8">
        <title>FIBFlix</title>
        <link rel="icon" type="image/png" href="Fotos/Logo FIBFlix.png">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
    </head>
    <body>
        <!-- Cabeçalho do Site -->
        <header class="site-header">
            <img src="Fotos/Logo FIBFlix.png" alt="Logo FIBFlix" class="site-logo">
            <nav class="site-nav">
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="filmes.html">Filmes</a></li>
                    <li><a href="series.html">Séries</a></li>
                    <li><a href="minha-lista.html">Minha Lista</a></li>
                </ul>
            </nav>
        </header>
        <div class="filtros">
            <select class="filtro" id="filtro-genero" aria-label="Filtrar por categoria">
                <option value="">Todos os gêneros</option>
                <option value="acao-aventura">Ação e Aventura</option>
                <option value="animacao">Animação</option>
                <option value="comedia">Comédia</option>
                <option value="drama">Drama</option>
                <option value="ficcao-fantasia">Ficção científica e fantasia</option>
            </select>

            <form class="pesquisa" id="form-busca">
                <input type="search" id="campo-busca" placeholder="Buscar filme...">
                <button type="submit" aria-label="Pesquisar">⌕</button>
            </form>
        </div>

        <!-- Resultados do filtro e da busca (aparecem no lugar dos destaques) -->
        <section class="lista-resultados d-none" id="resultados"></section>
        <div class="ver-mais-area d-none" id="area-mais">
            <button type="button" class="btn-ver-mais">Mostrar mais</button>
        </div>

        <div class="container" id="secoes">
            <div class ="col-md-12">
                <section class="destaques">
                    <h2>Séries em Destaque</h2>
                    <div class="series-borda">

                        <div class="card-conteudo">
                            <div class="poster">
                                <img src="Fotos/Poster Filme.png" alt="Pôster">
                                <span class="numero-top">1</span>
                            </div>
                            <h3>Título da Série</h3>
                            <p class="nota">
                                <span aria-label="estrelas">★</span>
                                <strong>4,5</strong>
                            </p>

                        </div>

                    </div>
                </section>

                <div class="col-md-12">
                    <section class="destaques acao-Series">
                        <h2>Ação e Aventura</h2>
                        <div class="series-borda">
                            <div class="card-conteudo">
                                <img src="Fotos/Poster Filme.png" alt="Pôster">
                                <h3>Título da Série</h3>
                                <p class="nota">
                                    <span aria-label="estrelas">★</span>
                                    <strong>4,5</strong>
                                </p>
                            </div>
                        </div>
                    </section>
                </div>

                <div class="col-md-12">
                    <section class="destaques aventura-Series">
                        <h2>Ficção científica e fantasia</h2>
                        <div class="series-borda">
                            <div class="card-conteudo">
                                <img src="Fotos/Poster Filme.png" alt="Pôster">
                                <h3>Título da Série</h3>
                                <p class="nota">
                                    <span aria-label="estrelas">★</span>
                                    <strong>4,5</strong>
                                </p>
                            </div>
                        </div>
                    </section>
                </div>

                <div class="col-md-12">
                    <section class="destaques animacao-Series">
                        <h2>Animação</h2>
                        <div class="series-borda">
                            <div class="card-conteudo">
                                <img src="Fotos/Poster Filme.png" alt="Pôster">
                                <h3>Título da Série</h3>
                                <p class="nota">
                                    <span aria-label="estrelas">★</span>
                                    <strong>4,5</strong>
                                </p>
                            </div>
                        </div>
                    </section>
                </div>

                <div class="col-md-12">
                    <section class="destaques comedia-Series">
                        <h2>Comédia</h2>
                        <div class="series-borda">
                            <div class="card-conteudo">
                                <img src="Fotos/Poster Filme.png" alt="Pôster">
                                <h3>Título da Série</h3>
                                <p class="nota">
                                    <span aria-label="estrelas">★</span>
                                    <strong>4,5</strong>
                                </p>
                            </div>
                        </div>
                    </section>
                </div>

                <div class="col-md-12">
                    <section class="destaques drama-Series">
                        <h2>Drama</h2>
                        <div class="series-borda">
                            <div class="card-conteudo">
                                <img src="Fotos/Poster Filme.png" alt="Pôster">
                                <h3>Título da Série</h3>
                                <p class="nota">
                                    <span aria-label="estrelas">★</span>
                                    <strong>4,5</strong>
                                </p>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
