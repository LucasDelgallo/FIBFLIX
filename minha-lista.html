<!DOCTYPE html>
<html lang="pt-br">
    <head>
        
        <meta charset="UTF-8">
        <title>FIBFlix</title>
        <link rel="icon" type="image/png" href="Fotos/Logo FIBFlix.png">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
    </head>
    <body>
        <!-- Cabeçalho do Site -->
        <header class="site-header">
            <img src="Fotos/Logo FIBFlix.png" alt="Logo FIBFlix" class="site-logo">
            <nav class="site-nav">
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="filmes.html">Filmes</a></li>
                    <li><a href="series.html">Séries</a></li>
                    <li><a href="minha-lista.html">Minha Lista</a></li>
                </ul>
            </nav>
        </header>

        <div class="filtros">
            <select class="filtro" id="filtro-ordem" aria-label="Ordenar filmes">
                <option value="">Ordenar por</option>
                <option value="a-z">Ordem de A a Z</option>
                <option value="z-a">Ordem de Z a A</option>
                <option value="recentes">Mais recentes</option>
                <option value="antigos">Mais antigos</option>
            </select>

            <div class="pesquisa">
                <input type="search" placeholder="Buscar filme ou série...">
                <button type="button" aria-label="Pesquisar">⌕</button>
            </div>
        </div>
        
        <p id="lista-vazia" class="text-center d-none">
            Sua lista está vazia. Favorite filmes e séries na página inicial!
        </p>

        <section class="lista-filmes" id="lista-filmes">
            <!-- cards inseridos pelo JS -->
        </section>

        <script src="script.js"></script>
    </body>
</html>
